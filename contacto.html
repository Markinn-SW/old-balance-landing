<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Old Balance</title>
  <!-- style.css lo mantienen los otros roles; contacto.css es solo nuestro (evita conflictos al hacer merge) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contacto.css">
</head>
<body class="pagina-contacto">

  <header class="navbar">
    <div class="logo">
        <span class="logo-badge">OB</span> Old Balance
    </div>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html#inicio">Inicio</a></li>
            <li><a href="index.html#quienes-somos">¿Quiénes somos?</a></li>
            <li><a href="index.html#productos">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="politicas.html">Políticas</a></li>
        </ul>
    </nav>
  </header>

  <main>
    <section id="contacto" class="contacto">
      <h1>Contáctanos</h1>
      <p class="intro">¿Dudas sobre tallas, pedidos o lanzamientos? Escríbenos y te respondemos pronto.</p>

      <!-- novalidate: desactiva los mensajes del navegador para usar los nuestros en JS -->
      <form id="form-contacto" novalidate>

        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name"
                 aria-describedby="error-nombre" required>
          <p class="error" id="error-nombre" role="alert"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email"
                 aria-describedby="error-correo" required>
          <p class="error" id="error-correo" role="alert"></p>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" maxlength="500"
                    aria-describedby="error-mensaje contador" required></textarea>
          <p class="contador" id="contador">0 / 500</p>
          <p class="error" id="error-mensaje" role="alert"></p>
        </div>

        <div class="campo campo-check">
          <input type="checkbox" id="acepto" name="acepto" aria-describedby="error-acepto">
          <label for="acepto">
            He leído y acepto las <a href="politicas.html" target="_blank" rel="noopener">políticas de privacidad</a>.
          </label>
          <p class="error" id="error-acepto" role="alert"></p>
        </div>

        <button type="submit" class="boton">Enviar mensaje</button>
        <p id="estado-form" class="estado" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Old Balance - We got this. &middot; <a href="contacto.html">Contacto</a> &middot; <a href="politicas.html">Políticas de seguridad</a></p>
  </footer>

  <script src="js/contacto.js"></script>
</body>
</html>
